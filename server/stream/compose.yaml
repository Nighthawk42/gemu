services:
  livekit:
    image: livekit/livekit-server:v1.13.6
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    networks:
      proxy_net:
        aliases: [gemu-livekit]
  broker:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./servers.json:/run/secrets/servers.json:ro
    networks:
      proxy_net:
        aliases: [gemu-stream-broker]
networks:
  proxy_net:
    external: true
